<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interface Humano Computador — HTMLearning v2.17</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --primary-dark: #3730a3;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --warning-bg: #fffbeb;
      --warning-border: #fef08a;
      --base-font-size: 18px;
    }

    body.dark-mode {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary-light: #1e1b4b;
    }

    body.presentation-mode {
      --base-font-size: 22px;
      --bg: #ffffff;
      --surface: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--base-font-size);
      line-height: 1.6;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 60px;
    }

    .container { max-width: 1050px; margin: 0 auto; padding: 16px; }

    /* Top Bar Header */
    header {
      background-color: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .badge { background: var(--primary-light); color: var(--primary-dark); padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.85em; }
    .badge-estudo { background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 12px; font-size: 0.75em; font-weight: bold; }
    .controls { display: flex; gap: 8px; }
    .btn-ctrl { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; color: var(--text); font-size: 0.85em; font-weight: bold; }
    .btn-ctrl:hover { background: var(--primary-light); }

    /* Score Bar */
    .score-bar {
      display: flex; gap: 16px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 0.9em; flex-wrap: wrap;
    }

    /* Sticky Folder Navigation */
    .nav-container {
      position: sticky; top: 0; z-index: 100; background-color: var(--bg); padding-top: 8px; margin-bottom: -2px;
    }
    .tab-list {
      display: flex; overflow-x: auto; gap: 4px; border-bottom: 2px solid var(--primary); padding-bottom: 0; list-style: none; scrollbar-width: thin;
    }
    .tab-item {
      background: var(--surface); border: 2px solid var(--border); border-bottom: none; border-radius: 10px 10px 0 0; padding: 10px 16px; cursor: pointer; font-weight: bold; font-size: 0.9em; white-space: nowrap; color: var(--text-muted); transition: all 0.2s;
    }
    .tab-item:hover { color: var(--primary); }
    .tab-item.active {
      background: var(--surface); border-color: var(--primary); color: var(--primary); border-bottom: 3px solid var(--surface); margin-bottom: -2px; z-index: 2;
    }

    /* Content Panels */
    .panel {
      display: none; background: var(--surface); border: 2px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; padding: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
    }
    .panel.active { display: block; }

    /* Sections within Panels */
    .section-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 20px;
    }
    .section-title { font-size: 1.25em; font-weight: bold; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

    /* Collapsible details */
    details { background: var(--primary-light); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    summary { font-weight: bold; cursor: pointer; color: var(--primary-dark); }
    details[open] summary { margin-bottom: 8px; }

    /* Boxes */
    .box-info { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 12px; margin-bottom: 16px; border-radius: 4px; font-size: 0.95em; }
    .box-instructions { background: var(--warning-bg); border: 1px solid var(--warning-border); border-left: 4px solid #f59e0b; padding: 12px; margin-bottom: 16px; border-radius: 4px; font-size: 0.9em; }
    .box-feedback { padding: 12px; border-radius: 6px; margin-top: 10px; font-weight: 500; }
    .box-feedback.success { background: var(--success-bg); border: 1px solid #bbf7d0; color: #15803d; }
    .box-feedback.error { background: var(--error-bg); border: 1px solid #fecaca; color: #b91c1c; }

    /* Demo Sandbox */
    .demo-container { background: var(--bg); border: 2px dashed var(--border); padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .btn-action { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 8px; margin-bottom: 8px; }
    .btn-action:hover { background: var(--primary-dark); }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Quiz Styling */
    .quiz-container { margin-top: 20px; }
    .quiz-q { margin-bottom: 20px; background: var(--bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
    .quiz-opt { display: block; width: 100%; text-align: left; padding: 10px 14px; margin: 6px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.95em; color: var(--text); }
    .quiz-opt:hover:not(:disabled) { background: var(--primary-light); }
    .quiz-opt.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); font-weight: bold; }
    .quiz-opt.wrong { background: var(--error-bg); border-color: var(--error); color: var(--error); text-decoration: line-through; }

    /* Presenter Script */
    .presenter-script { display: none; background: #f0fdf4; border: 1px solid #86efac; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85em; color: #166534; }
    body.presentation-mode .presenter-script { display: block; }

    /* Footer */
    footer { margin-top: 40px; padding: 20px; border-top: 2px solid var(--border); font-size: 0.85em; color: var(--text-muted); }
    footer hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
    footer a { color: var(--primary); text-decoration: underline; }
    .footer-block-title { font-weight: bold; color: var(--text); margin-bottom: 8px; }
  </style>
</head>

    function setupRouting() {
      window.addEventListener("hashchange", handleHashChange);
      if (!window.location.hash) {
        window.location.hash = "#aba-1";
      } else {
        handleHashChange();
      }
    }

    function handleHashChange() {
      const hash = window.location.hash || "#aba-1";
      const targetId = hash.replace("#", "");
      
      const tabItems = document.querySelectorAll(".tab-item");
      const panels = document.querySelectorAll(".panel");

      let found = false;
      tabItems.forEach(item => {
        if (item.getAttribute("data-tab") === targetId) {
          item.classList.add("active");
          item.setAttribute("aria-selected", "true");
          found = true;
        } else {
          item.classList.remove("active");
          item.setAttribute("aria-selected", "false");
        }
      });

      panels.forEach(panel => {
        if (panel.id === targetId) {
          panel.classList.add("active");
        } else {
          panel.classList.remove("active");
        }
      });

      if (!found && tabItems.length > 0) {
        tabItems[0].classList.add("active");
        panels[0].classList.add("active");
      }
    }

    function switchTab(tabId) {
      window.location.hash = "#" + tabId;
    }

    function renderTabs() {
      const headersContainer = document.getElementById("tab-headers");
      headersContainer.innerHTML = "";

      AULA_DADOS.forEach(aba => {
        const li = document.createElement("li");
        li.className = "tab-item";
        li.setAttribute("data-tab", aba.id);
        li.setAttribute("role", "tab");
        li.onclick = () => switchTab(aba.id);

        let badgeHtml = aba.estudoProprio ? ' <span class="badge-estudo">📖 Estudo próprio</span>' : '';
        li.innerHTML = `${aba.titulo}${badgeHtml}`;
        headersContainer.appendChild(li);
      });

      // Aba de Revisão
      const liRev = document.createElement("li");
      liRev.className = "tab-item";
      liRev.setAttribute("data-tab", "aba-revisao");
      liRev.setAttribute("role", "tab");
      liRev.onclick = () => switchTab("aba-revisao");
      liRev.innerHTML = "🎯 Revisão & Chefão";
      headersContainer.appendChild(liRev);
    }

    function renderPanels() {
      const panelsContainer = document.getElementById("tab-panels");
      panelsContainer.innerHTML = "";

      AULA_DADOS.forEach(aba => {
        const panel = document.createElement("div");
        panel.className = "panel";
        panel.id = aba.id;
        panel.setAttribute("role", "tabpanel");

        let html = `
          <div class="presenter-script">
            <strong>🎤 Roteiro do Apresentador:</strong> Apresente a missão de usabilidade: "${aba.narrativa}". Destaque os exemplos do mundo real e incentive a previsão na simulação.
          </div>

          <div class="section-card">
            <h2 class="section-title">🎯 Missão da Aula</h2>
            <p>${aba.narrativa}</p>
          </div>

          <div class="section-card">
            <h2 class="section-title">🌍 Casos do Mundo Real & Ferramentas</h2>
            <ul>
              ${aba.mundoReal.map(item => `<li><strong>Exemplo Real:</strong> ${item}</li>`).join('')}
              ${aba.ferramentas.map(item => `<li><strong>Ferramenta:</strong> ${item}</li>`).join('')}
            </ul>
          </div>

          <details>
            <summary>📖 Mini-Dicionário de Usabilidade da Aba</summary>
            <ul style="margin-top: 8px; padding-left: 20px;">
              ${aba.dicionario.map(d => `<li><strong>${d.termo}:</strong> ${d.def}</li>`).join('')}
            </ul>
          </details>

          <details>
            <summary>💡 Conceitos Chave & Analogias</summary>
            ${aba.conceitos.map(c => `
              <div style="margin-top: 8px; margin-bottom: 12px;">
                <h4>${c.titulo}</h4>
                <p>${c.texto}</p>
                <p style="color: var(--primary-dark); font-weight: bold;">${c.analogia}</p>
                <p><em>Exemplo Prático: ${c.exemploReal}</em></p>
              </div>
            `).join('')}
          </details>

          <div class="section-card">
            <h2 class="section-title">🎮 Demonstração Interativa com Previsão</h2>
            <div class="box-instructions">
              <strong>📋 INSTRUÇÕES PASSO A PASSO:</strong><br>
              ${aba.roteiroDemo.passo0}<br>
              <ul>
                ${aba.roteiroDemo.passos.map((p, idx) => `<li><strong>Passo ${idx+1}:</strong> ${p.acao} → <em>Observar: ${p.ve}</em> (${p.significa})</li>`).join('')}
              </ul>
            </div>
            
            <div class="demo-container">
              ${renderDemoBody(aba)}
            </div>
            <button class="btn-ctrl" onclick="resetDemo('${aba.id}')">🔄 Reiniciar demo</button>
          </div>

          <div class="section-card">
            <h2 class="section-title">❓ Quiz com Tentativa e Erro Guiado</h2>
            <div class="box-info">
              🔑 <strong>Termos deste quiz:</strong> ${aba.dicionario.map(d => `${d.termo} = ${d.def}`).join(' · ')}
            </div>
            <div class="quiz-container">
              ${renderQuiz(aba)}
            </div>
          </div>

          <details>
            <summary>🔍 Aprofundar (Buscas em Português)</summary>
            <ul style="margin-top: 8px; padding-left: 20px;">
              ${aba.aprofundar.map(a => `<li><a href="${a.url}" target="_blank">${a.rotulo}</a></li>`).join('')}
            </ul>
          </details>

          <div class="box-info" style="margin-top: 16px;">
            <strong>${aba.mitoOuVerdade.afirmacao}</strong><br>
            <p>${aba.mitoOuVerdade.explicacao}</p>
          </div>
        `;

        panel.innerHTML = html;
        panelsContainer.appendChild(panel);
      });

      // Panel de Revisão
      const revPanel = document.createElement("div");
      revPanel.className = "panel";
      revPanel.id = "aba-revisao";
      revPanel.setAttribute("role", "tabpanel");

      revPanel.innerHTML = `
        <div class="section-card">
          <h2 class="section-title">🗺️ Mapa Completo da Aula</h2>
          <ul>
            ${REVISAO_DADOS.mapa.map(item => `<li>${item}</li>`).join('')}
          </ul>
        </div>

        <div class="section-card">
          <h2 class="section-title">⚡ Cola Rápida (Glossário de Revisão)</h2>
          <table style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
              <tr style="border-bottom: 2px solid var(--border);">
                <th style="padding: 8px;">Conceito / Termo</th>
                <th style="padding: 8px;">Explicação Rápida em Linguagem Plana</th>
              </tr>
            </thead>
            <tbody>
              ${REVISAO_DADOS.cola.map(c => `
                <tr style="border-bottom: 1px solid var(--border);">
                  <td style="padding: 8px; font-weight: bold; color: var(--primary);">${c.termo}</td>
                  <td style="padding: 8px;">${c.linha}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <div class="section-card" style="background: var(--primary-light); border-color: var(--primary);">
          <h2 class="section-title">🤠 O Desafio do Chefão de IHC</h2>
          <p style="font-size: 1.05em; margin-bottom: 12px;">${REVISAO_DADOS.desafio}</p>
          <textarea style="width: 100%; height: 120px; padding: 10px; border-radius: 6px; border: 1px solid var(--border); font-family: inherit;" placeholder="Escreva sua resposta estruturada aqui para consolidar seu aprendizado..."></textarea>
          <button class="btn-action" style="margin-top: 8px;" onclick="alert('Excelente! Sua resposta foi salva localmente no seu progresso mental. Continue praticando IHC!')">Enviar Resposta do Chefão</button>
        </div>
      `;

      panelsContainer.appendChild(revPanel);
    }

    function renderDemoBody(aba) {
      if (aba.demo.tipo === "simulacao_status") {
        return `
          <p style="margin-bottom: 8px;"><strong>Simulador de Status de Envio de Formulário:</strong></p>
          <button class="btn-action" id="btn-demo1-sem" onclick="execDemo1(false)">Enviar sem Feedback Visual</button>
          <button class="btn-action" id="btn-demo1-com" onclick="execDemo1(true)">Enviar com Barra de Status</button>
          <div id="demo1-out" class="box-feedback" style="display:none;"></div>
        `;
      } else if (aba.demo.tipo === "simulacao_rotulo") {
        return `
          <p style="margin-bottom: 8px;"><strong>Simulador de Rótulo de Botão de Ação:</strong></p>
          <button class="btn-action" onclick="execDemo2(false)">Botão com Rótulo Genérico ('Avançar')</button>
          <button class="btn-action" onclick="execDemo2(true)">Botão com Rótulo Claro ('Pagar R$ 50,00 Agora')</button>
          <div id="demo2-out" class="box-feedback" style="display:none;"></div>
        `;
      } else if (aba.demo.tipo === "simulacao_curva_nielsen") {
        return `
          <p style="margin-bottom: 8px;"><strong>Simulador da Curva de Descoberta de Nielsen:</strong></p>
          <label>Selecione a quantidade de usuários no teste: </label>
          <input type="range" id="nielsen-range" min="1" max="15" value="1" oninput="execDemo3(this.value)" style="margin-right: 8px;">
          <span id="nielsen-val" style="font-weight:bold;">1 usuário</span>
          <div id="demo3-out" class="box-feedback success" style="margin-top:12px;">
            Descoberta de Usabilidade: <strong>31% dos problemas encontrados</strong>.
          </div>
        `;
      } else if (aba.demo.tipo === "simulacao_metricas") {
        return `
          <p style="margin-bottom: 8px;"><strong>Simulador de Eficiência ISO 9241-11:</strong></p>
          <button class="btn-action" onclick="execDemo4(4)">Simular Tarefa com 4 Erros</button>
          <button class="btn-action" onclick="execDemo4(0)">Simular Tarefa sem Erros</button>
          <div id="demo4-out" class="box-feedback" style="display:none;"></div>
        `;
      } else if (aba.demo.tipo === "simulacao_postura_facilitador") {
        return `
          <p style="margin-bottom: 8px;"><strong>Simulador de Postura do Facilitador de Testes:</strong></p>
          <button class="btn-action" onclick="execDemo5(false)">Postura Incorreta: Reprovar participante</button>
          <button class="btn-action" onclick="execDemo5(true)">Postura Correta: Apoio Neutro com Foco no Sistema</button>
          <div id="demo5-out" class="box-feedback" style="display:none;"></div>
        `;
      } else {
        return `
          <p style="margin-bottom: 8px;"><strong>Simulador de Priorização de Redesign:</strong></p>
          <button class="btn-action" onclick="execDemo6(true)">Priorizar Correção Catastrófica (Erro de Formulário)</button>
          <button class="btn-action" onclick="execDemo6(false)">Priorizar Correção Cosmética (Tom de Cinza)</button>
          <div id="demo6-out" class="box-feedback" style="display:none;"></div>
        `;
      }
    }

    // DEMO IMPLEMENTATIONS
    function execDemo1(comStatus) {
      const out = document.getElementById("demo1-out");
      out.style.display = "block";
      if (!comStatus) {
        out.className = "box-feedback error";
        out.innerHTML = "❌ <strong>Violação Heurística 1:</strong> A tela não respondeu. O usuário clicou 5 vezes repetidas achando que travou, gerando duplicidade no banco de dados.";
      } else {
        out.className = "box-feedback success";
        out.innerHTML = "✅ <strong>Heurística 1 Aplicada:</strong> Barra 'Carregando 45%...' exibida. O usuário aguardou com segurança sem clicar novamente.";
      }
    }

    function execDemo2(claro) {
      const out = document.getElementById("demo2-out");
      out.style.display = "block";
      if (!claro) {
        out.className = "box-feedback error";
        out.innerHTML = "❌ <strong>Falha na Pergunta 3 do Percurso Cognitivo:</strong> O rótulo 'Avançar' deixou o usuário inseguro sobre se seria cobrado imediatamente ou não.";
      } else {
        out.className = "box-feedback success";
        out.innerHTML = "✅ <strong>Percurso Cognitivo Aprovado:</strong> O rótulo 'Pagar R$ 50,00 Agora' comunicou exatamente a consequência da ação.";
      }
    }

    function execDemo3(val) {
      document.getElementById("nielsen-val").innerText = val + (val == 1 ? " usuário" : " usuários");
      const percent = Math.round(100 * (1 - Math.pow(1 - 0.31, val)));
      const out = document.getElementById("demo3-out");
      out.innerHTML = `Descoberta de Usabilidade: <strong>${percent}% dos problemas encontrados</strong> por ${val} usuário(s).`;
      if (val >= 5) {
        out.innerHTML += `<br>💡 <em>A partir do 5º usuário (${percent}%), a curva estabiliza. Testar com mais pessoas repetirá falhas já conhecidas.</em>`;
      }
    }

    function execDemo4(erros) {
      const out = document.getElementById("demo4-out");
      out.style.display = "block";
      if (erros > 0) {
        out.className = "box-feedback error";
        out.innerHTML = "❌ <strong>Baixa Eficiência (ISO 9241-11):</strong> Com 4 erros, o tempo subiu para 180 segundos. O usuário manifestou alta frustração.";
      } else {
        out.className = "box-feedback success";
        out.innerHTML = "✅ <strong>Alta Eficiência (ISO 9241-11):</strong> Sem erros na interface, a tarefa foi concluída em apenas 25 segundos.";
      }
    }

    function execDemo5(correta) {
      const out = document.getElementById("demo5-out");
      out.style.display = "block";
      if (!correta) {
        out.className = "box-feedback error";
        out.innerHTML = "❌ <strong>Violação Ética:</strong> Dizer ao participante que ele 'errou' gera constrangimento e interrompe a narração espontânea no Think Aloud.";
      } else {
        out.className = "box-feedback success";
        out.innerHTML = "✅ <strong>Postura Correta do Facilitador:</strong> Reafirmar 'Estamos testando a tela e não você' mantém o ambiente acolhedor e os dados válidos.";
      }
    }

    function execDemo6(catastrofica) {
      const out = document.getElementById("demo6-out");
      out.style.display = "block";
      if (!catastrofica) {
        out.className = "box-feedback error";
        out.innerHTML = "❌ <strong>Baixa Prioridade de Reengenharia:</strong> Ajustar o tom de cinza do rodapé não resolve o problema dos usuários que não conseguem enviar o formulário.";
      } else {
        out.className = "box-feedback success";
        out.innerHTML = "✅ <strong>Prioridade de Redesign Correta:</strong> Corrigir falhas catastróficas destrava o uso do produto imediatamente para o cliente final.";
      }
    }

    function resetDemo(abaId) {
      const panel = document.getElementById(abaId);
      const feedbacks = panel.querySelectorAll(".box-feedback");
      feedbacks.forEach(f => {
        if (f.id !== "demo3-out") f.style.display = "none";
      });
      const range = panel.querySelector("#nielsen-range");
      if (range) {
        range.value = 1;
        execDemo3(1);
      }
    }

    // QUIZ SYSTEM
    function renderQuiz(aba) {
      return aba.quiz.map((q, qIdx) => {
        // Embaralhar opções com Fisher-Yates sem perder atributos
        let opts = q.opcoes.map((opt, originalIdx) => ({ ...opt, originalIdx }));
        opts = shuffleArray(opts);

        return `
          <div class="quiz-q" id="q-${aba.id}-${qIdx}">
            <p style="font-weight: bold; margin-bottom: 8px;">${qIdx + 1}. ${q.pergunta}</p>
            ${opts.map((opt) => `
              <button class="quiz-opt" 
                      data-correct="${opt.correta}" 
                      data-fb="${opt.fb}" 
                      onclick="checkAnswer(this, '${aba.id}', ${qIdx})">
                ${opt.texto}
              </button>
            `).join('')}
            <div class="quiz-fb box-feedback" style="display:none;"></div>
          </div>
        `;
      }).join('');
    }

    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function checkAnswer(btn, abaId, qIdx) {
      const container = document.getElementById(`q-${abaId}-${qIdx}`);
      const isCorrect = btn.getAttribute("data-correct") === "true";
      const fbText = btn.getAttribute("data-fb");
      const fbBox = container.querySelector(".quiz-fb");

      const key = `${abaId}-${qIdx}`;
      if (!state.quizState[key]) {
        state.quizState[key] = { attempts: 0, solved: false };
      }

      if (state.quizState[key].solved) return;

      state.quizState[key].attempts++;

      fbBox.style.display = "block";

      if (isCorrect) {
        btn.classList.add("correct");
        btn.innerHTML = "✓ " + btn.innerHTML;
        fbBox.className = "quiz-fb box-feedback success";
        fbBox.innerHTML = `✅ <strong>Por que esta está certa:</strong> ${fbText}`;
        state.quizState[key].solved = true;

        // Disable all buttons in this question
        container.querySelectorAll(".quiz-opt").forEach(b => b.disabled = true);

        // Scoring: 10 XP first try, 5 XP retry
        const points = state.quizState[key].attempts === 1 ? 10 : 5;
        addXP(points);
        checkTabCompletion(abaId);
      } else {
        btn.classList.add("wrong");
        btn.disabled = true;
        btn.innerHTML = "✗ " + btn.innerHTML;
        fbBox.className = "quiz-fb box-feedback error";
        fbBox.innerHTML = `❌ <strong>Por que esta está errada:</strong> ${fbText}`;
      }
    }

    function addXP(points) {
      state.xp += points;
      updateScoreboard();
    }

    function checkTabCompletion(abaId) {
      const aba = AULA_DADOS.find(a => a.id === abaId);
      if (!aba) return;

      let allSolved = true;
      aba.quiz.forEach((_, qIdx) => {
        const key = `${abaId}-${qIdx}`;
        if (!state.quizState[key] || !state.quizState[key].solved) {
          allSolved = false;
        }
      });

      if (allSolved) {
        state.completedTabs.add(abaId);
        updateScoreboard();
      }
    }

    function updateScoreboard() {
      document.getElementById("xp-display").innerText = state.xp;
      document.getElementById("progress-display").innerText = `${state.completedTabs.size}/6 abas`;

      let selos = [];
      if (state.xp >= 30) selos.push("🥉 Inspetor Jr.");
      if (state.xp >= 80) selos.push("🥈 Avaliador Pleno");
      if (state.xp >= 140) selos.push("🥇 Mestre de Usabilidade");

      document.getElementById("badges-display").innerText = selos.length > 0 ? selos.join(" · ") : "Nenhum";
    }

    // MODES
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    function togglePresentationMode() {
      document.body.classList.toggle("presentation-mode");
    }
  </script>
</body>
