<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interface Humano Computador — Testes Empíricos e Oficina Prática</title>
<style>
  :root {
    --accent: #0f766e;
    --accent-dark: #115e59;
    --accent-soft: #ccfbf1;
    --accent-border: #14b8a6;
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-alt: #f1f5f9;
    --text: #0f172a;
    --text-muted: #475569;
    --border: #cbd5e1;
    --warn-bg: #fef9c3;
    --warn-border: #eab308;
    --ok-bg: #dcfce7;
    --ok-border: #16a34a;
    --err-bg: #fee2e2;
    --err-border: #dc2626;
    --shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    --font-size: 18px;
  }

  body.dark-mode {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-alt: #334155;
    --text: #f8fafc;
    --text-muted: #cbd5e1;
    --border: #475569;
    --accent-soft: #134e4a;
    --warn-bg: #422006;
    --warn-border: #ca8a04;
    --ok-bg: #14532d;
    --ok-border: #22c55e;
    --err-bg: #450a0a;
    --err-border: #ef4444;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }

  body.presentation-mode {
    --font-size: 22px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: var(--font-size);
    line-height: 1.6;
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }

  /* Top Controls Bar */
  .top-bar {
    background: var(--surface);
    border-bottom: 3px solid var(--accent);
    padding: 0.75rem 1.25rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .brand-area h1 {
    margin: 0;
    font-size: 1.25em;
    color: var(--accent);
  }

  body.dark-mode .brand-area h1 {
    color: #5eead4;
  }

  .brand-area p {
    margin: 0.15rem 0 0;
    font-size: 0.85em;
    color: var(--text-muted);
  }

  .controls-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }

  .hud-pill {
    background: var(--accent-soft);
    color: var(--text);
    border: 2px solid var(--accent);
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.85em;
  }

  .btn-ctrl {
    background: var(--surface-alt);
    color: var(--text);
    border: 2px solid var(--border);
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
    font-size: 0.85em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-ctrl:hover {
    border-color: var(--accent);
  }

  .btn-ctrl.active-mode {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  /* Sticky Folder Tabs */
  .tabs-wrapper {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--surface-alt);
    border-bottom: 3px solid var(--accent);
    padding: 0.5rem 1rem 0;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: thin;
  }

  .tablist {
    display: inline-flex;
    gap: 0.35rem;
    min-width: 100%;
  }

  .tab-btn {
    background: var(--surface-alt);
    color: var(--text-muted);
    border: 2px solid var(--border);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 0.65rem 1rem;
    font-size: 0.9em;
    font-weight: 700;
    cursor: pointer;
    position: relative;
    top: 3px;
    transition: background 0.15s, color 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .tab-btn:hover {
    color: var(--text);
    background: var(--surface);
  }

  .tab-btn[aria-selected="true"] {
    background: var(--bg);
    color: var(--text);
    border-color: var(--accent);
    border-width: 3px 3px 0 3px;
    padding-bottom: calc(0.65rem + 3px);
  }

  .badge-self {
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #f59e0b;
    font-size: 0.72em;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    font-weight: 800;
  }

  .badge-done {
    color: #16a34a;
    font-weight: 900;
  }

  /* Main Container */
  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
  }

  .tab-panel {
    display: none;
  }

  .tab-panel.active {
    display: block;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 3px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem 1.4rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }

  .card-accent {
    border-color: var(--accent);
  }

  .section-tag {
    display: inline-block;
    background: var(--accent);
    color: #ffffff;
    font-size: 0.78em;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.2rem 0.65rem;
    border-radius: 6px;
    margin-bottom: 0.6rem;
  }

  h2 {
    margin: 0.2rem 0 0.8rem;
    font-size: 1.45em;
    line-height: 1.25;
  }

  h3 {
    margin: 0.2rem 0 0.7rem;
    font-size: 1.18em;
  }

  /* Presenter Script (Hidden in Reading Mode, Shown in Presentation Mode) */
  .presenter-box {
    display: none;
    background: #eef2ff;
    color: #1e1b4b;
    border: 3px solid #4f46e5;
    border-radius: 12px;
    padding: 1rem 1.2rem;
    margin-bottom: 1.5rem;
  }

  body.presentation-mode .presenter-box {
    display: block;
  }

  .presenter-box h4 {
    margin: 0 0 0.5rem;
    color: #3730a3;
  }

  /* Lists & Grid */
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
    margin-top: 0.8rem;
  }

  .mini-box {
    background: var(--surface-alt);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
  }

  /* Details / Collapsibles */
  details {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem 1.1rem;
    margin-bottom: 1rem;
  }

  details.det-dict { background: #f0fdfa; border-color: #5eead4; }
  details.det-conc { background: #f8fafc; border-color: #94a3b8; }
  details.det-mito { background: #fffbeb; border-color: #fcd34d; }
  details.det-deep { background: #eff6ff; border-color: #93c5fd; }

  body.dark-mode details.det-dict,
  body.dark-mode details.det-conc,
  body.dark-mode details.det-mito,
  body.dark-mode details.det-deep {
    background: var(--surface);
    border-color: var(--border);
  }

  summary {
    font-weight: 800;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  summary::-webkit-details-marker {
    display: none;
  }

  summary::after {
    content: "▼";
    font-size: 0.8em;
    color: var(--accent);
  }

  details[open] summary::after {
    content: "▲";
  }

  .details-body {
    margin-top: 0.9rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--border);
  }

  /* Demo Box */
  .demo-instructions {
    background: var(--warn-bg);
    border: 3px solid var(--warn-border);
    border-radius: 10px;
    padding: 0.95rem 1.1rem;
    margin-bottom: 1rem;
  }

  .demo-stage {
    background: var(--surface-alt);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem;
    margin-bottom: 0.85rem;
  }

  .demo-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    margin-top: 0.8rem;
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    border: 2px solid var(--accent-dark);
    padding: 0.55rem 1rem;
    border-radius: 8px;
    font-size: 0.92em;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-dark);
  }

  .btn-primary:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .btn-reset {
    background: var(--surface);
    color: var(--text);
    border: 2px solid var(--border);
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    font-size: 0.88em;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-reset:hover {
    border-color: var(--accent);
  }

  .demo-choice-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.55rem;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .demo-choice-btn:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .demo-choice-btn.is-wrong {
    background: var(--err-bg);
    border-color: var(--err-border);
    color: var(--text);
  }

  .demo-choice-btn.is-right {
    background: var(--ok-bg);
    border-color: var(--ok-border);
    color: var(--text);
  }

  .feedback-box {
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-top: 0.75rem;
    border: 2px solid var(--border);
    background: var(--surface);
  }

  .feedback-box.fb-ok {
    background: var(--ok-bg);
    border-color: var(--ok-border);
  }

  .feedback-box.fb-err {
    background: var(--err-bg);
    border-color: var(--err-border);
  }

  .observe-box {
    background: var(--accent-soft);
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-top: 0.8rem;
  }

  /* Quiz */
  .quiz-terms {
    background: var(--surface-alt);
    border-left: 5px solid var(--accent);
    padding: 0.85rem 1rem;
    border-radius: 8px;
    margin-bottom: 1.2rem;
    font-size: 0.92em;
  }

  .quiz-q {
    margin-bottom: 1.4rem;
    padding-bottom: 1.2rem;
    border-bottom: 2px dashed var(--border);
  }

  .quiz-q:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 0.7rem 1rem;
    margin-top: 0.5rem;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
  }

  .quiz-opt:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .quiz-opt.opt-wrong {
    background: var(--err-bg);
    border-color: var(--err-border);
  }

  .quiz-opt.opt-right {
    background: var(--ok-bg);
    border-color: var(--ok-border);
  }

  /* Rainbow Matrix Table */
  .rainbow-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 0.6rem;
    font-size: 0.88em;
  }

  .rainbow-table th, .rainbow-table td {
    border: 2px solid var(--border);
    padding: 0.5rem;
    text-align: center;
  }

  .rainbow-table td.obs-cell {
    text-align: left;
    font-weight: 600;
  }

  .cell-toggle {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-weight: 800;
  }

  .cell-toggle.marked {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent-dark);
  }

  /* Revision Tab */
  .cola-item {
    padding: 0.6rem 0.8rem;
    border-bottom: 1px solid var(--border);
  }

  .cola-item:last-child {
    border-bottom: none;
  }

  /* Footer */
  footer {
    max-width: 1040px;
    margin: 2rem auto 0;
    padding: 1.5rem 1rem 2.5rem;
    border-top: 3px solid var(--border);
    font-size: 0.82em;
    color: var(--text-muted);
  }

  .footer-block {
    margin-bottom: 1.2rem;
  }

  .footer-block h4 {
    margin: 0 0 0.45rem;
    color: var(--text);
    font-size: 1.05em;
  }

  .footer-block p, .footer-block li {
    margin: 0.25rem 0;
  }

  .footer-block ul {
    padding-left: 1.2rem;
    margin: 0.35rem 0;
  }

  footer a {
    color: var(--accent);
    word-break: break-all;
  }

  body.dark-mode footer a {
    color: #5eead4;
  }
</style>
</head>
<body>

<header class="top-bar">
  <div class="brand-area">
    <h1>Interface Humano Computador</h1>
    <p>Fundamentos de Testes Empíricos e Oficina Prática (Hands-on)</p>
  </div>
  <div class="controls-group">
    <span class="hud-pill" id="hud-xp">⭐ 0 XP</span>
    <span class="hud-pill" id="hud-badges">🏅 0/6 selos</span>
    <button type="button" class="btn-ctrl" id="btn-mode" aria-pressed="false">🎤 Modo Aula</button>
    <button type="button" class="btn-ctrl" id="btn-dark" aria-pressed="false">🌙 Escuro</button>
  </div>
</header>

<nav class="tabs-wrapper" aria-label="Abas da aula">
  <div class="tablist" role="tablist" id="tablist"></div>
</nav>

<main id="main-content"></main>

<script>
const AULA_DADOS = {
  abas: [
    {
      id: "aba-1",
      titulo: "1. Escopo e Métricas",
      estudoProprio: false,
      narrativa: "Antes de chamar qualquer pessoa para testar uma tela, a equipe precisa responder a uma pergunta simples: o que exatamente queremos descobrir e como vamos medir se deu certo? Testar sem objetivo vira apenas uma conversa solta sem impacto no produto. Nesta etapa, conectamos as dúvidas da equipe (perguntas de pesquisa) e as suspeitas de onde o sistema confunde (hipóteses de falha de usabilidade) às metas reais da organização, escolhendo números (indicadores quantitativos) e observações humanas (indicadores qualitativos) para julgar o resultado.",
      mundoReal: [
        "No Nubank (banco digital brasileiro), antes de redesenhar a tela de transferência via Pix (sistema de pagamentos instantâneos do Banco Central), a equipe define hipóteses claras — como 'usuários confundem a chave aleatória com o código copia-e-cola' — e mede o tempo para concluir o envio e a taxa de erros antes de liberar o visual novo para milhões de clientes.",
        "No Gov.br (portal único de serviços públicos do governo federal), equipes de experiência do usuário medem a taxa de sucesso na solicitação de documentos digitais e aplicam escalas rápidas de percepção de facilidade logo após cada tarefa para descobrir etapas burocráticas que travam o cidadão."
      ],
      ferramentas: [
        "Planilha de Plano de Pesquisa (matriz simples em ferramentas como Google Planilhas ou LibreOffice Calc que cruza cada pergunta de pesquisa com sua hipótese e sua métrica).",
        "Questionário pós-tarefa SEQ (do inglês Single Ease Question; em português, Pergunta Única de Facilidade: uma escala de 1 a 7 aplicada imediatamente após o usuário terminar uma atividade) e questionário SUS (do inglês System Usability Scale; em português, Escala de Usabilidade do Sistema: formulário padronizado de 10 perguntas que gera uma nota de 0 a 100)."
      ],
      dicionario: [
        { termo: "Hipótese de falha de usabilidade", def: "Suposição testável sobre uma dificuldade específica que o usuário pode enfrentar ao tentar usar uma tela ou fluxo." },
        { termo: "SEQ (Single Ease Question — Pergunta Única de Facilidade)", def: "Pergunta rápida feita logo após uma tarefa, na qual o participante dá nota de 1 (muito difícil) a 7 (muito fácil) para aquela atividade." },
        { termo: "SUS (System Usability Scale — Escala de Usabilidade do Sistema)", def: "Questionário padrão com 10 afirmações alternadas (positivas e negativas) respondido ao final do teste para calcular um índice geral de 0 a 100." },
        { termo: "Modelo mental do usuário", def: "A imagem interna de como a pessoa acha que o sistema funciona, construída a partir de suas experiências anteriores com outros aplicativos e objetos." }
      ],
      conceitos: [
        {
          titulo: "Alinhamento entre Pesquisa, Hipóteses e Metas de Negócio",
          texto: "Toda avaliação empírica começa conectando três camadas: a meta do negócio (por exemplo, reduzir o abandono no carrinho de compras), a pergunta de pesquisa (por que as pessoas desistem na etapa de frete?) e a hipótese de falha (o campo de CEP exige traço e não avisa quando dá erro).",
          analogia: "💡 É como um médico pedir um exame de sangue específico em vez de pedir 'todos os exames do laboratório': você só sabe interpretar o resultado se souber qual suspeita está investigando.",
          exemploReal: "No Mercado Livre (plataforma de comércio eletrônico na América Latina), se a meta é reduzir chamadas no suporte sobre devoluções, a hipótese foca em verificar se o botão 'Devolver grátis' fica visível no histórico de pedidos sem exigir busca escondida."
        },
        {
          titulo: "Métricas Quantitativas vs. Indicadores Qualitativos",
          texto: "Indicadores quantitativos respondem 'quanto' e 'quantos': taxa de sucesso (percentual de pessoas que completam a tarefa), tempo por tarefa, taxa de erro e notas como SEQ e SUS. Já os indicadores qualitativos respondem 'por quê': expressões faciais de frustração, suspiros, hesitações e a explicação do modelo mental do usuário sobre o que esperava que acontecesse.",
          analogia: "💡 Os números são o placar do jogo; as observações qualitativas são a gravação em câmera lenta mostrando exatamente onde o time falhou no passe.",
          exemploReal: "No iFood (aplicativo brasileiro de entrega de comida), medir que 40% dos usuários demoram mais de 90 segundos para alterar o endereço (quantitativo) ganha sentido quando a observação mostra que eles tentam clicar no nome da rua no topo, mas o aplicativo exige abrir o menu de perfil (qualitativo)."
        }
      ],
      roteiroDemo: {
        passo0: "Antes de clicar, preveja: se a meta de negócio de um aplicativo bancário é reduzir chamadas no atendimento sobre boletos vencidos, qual indicador quantitativo e qual sinal qualitativo mostram se a tela resolve o problema?",
        passos: [
          { acao: "Clique no botão '1. Carregar Caso Bancário' para exibir o cenário de negócio.", ve: "O painel mostra a meta de reduzir dúvidas sobre atualização automática de boleto vencido.", significa: "Todo teste começa pela meta de negócio antes de escolher botões ou telas." },
          { acao: "Selecione a hipótese de usabilidade correta entre as opções apresentadas.", ve: "O sistema valida a conexão entre a dúvida do cliente e o comportamento esperado na interface.", significa: "Sem hipótese clara, não sabemos o que observar durante a sessão." },
          { acao: "Escolha o par de métricas (quantitativa + qualitativa) e veja o painel de diagnóstico.", ve: "Aparecem a taxa de sucesso, o tempo por tarefa, a nota SEQ e o registro do modelo mental.", significa: "Combinar números e observações evita decisões cegas." }
        ]
      },
      demo: {
        tipo: "cenario-escopo",
        config: {}
      },
      quiz: [
        {
          pergunta: "Uma equipe quer avaliar o novo fluxo de agendamento de consultas de um aplicativo de saúde. Qual deve ser o ponto de partida antes de escrever o teste?",
          alternativas: [
            { texto: "Conectar as perguntas de pesquisa e hipóteses de falha às metas reais do sistema.", certa: true, fb: "Exato! Quando alinhamos perguntas e hipóteses às metas (como reduzir agendamentos abandonados), cada tarefa avaliada gera evidência útil para melhorar o produto." },
            { texto: "Aplicar o questionário SUS (Escala de Usabilidade do Sistema) antes mesmo de ter uma tela.", certa: false, fb: "O SUS (System Usability Scale — Escala de Usabilidade do Sistema) avalia a percepção após o uso de uma interface; aplicá-lo sem um fluxo testado não revela onde estão as falhas." },
            { texto: "Medir apenas o tempo total que o programador levou para construir a tela.", certa: false, fb: "O tempo de desenvolvimento mede esforço da equipe técnica, não a facilidade de uso nem o sucesso do paciente ao tentar marcar uma consulta." }
          ]
        },
        {
          pergunta: "Logo após um participante concluir a tarefa de encontrar o comprovante de pagamento, o moderador faz uma única pergunta de 1 a 7 sobre o quão fácil foi aquela atividade. Qual indicador é esse?",
          alternativas: [

const state = {
  activeTab: 0,
  xp: 0,
  completedTabs: new Set(),
  quizAnswered: {}, // key: "abaIdx-qIdx" -> { solved: bool, wrongOpts: Set }
  demoStates: {}
};

function addXP(points) {
  state.xp += points;
  updateHUD();
}

function updateHUD() {
  document.getElementById("hud-xp").textContent = "⭐ " + state.xp + " XP";
  document.getElementById("hud-badges").textContent = "🏅 " + state.completedTabs.size + "/" + AULA_DADOS.abas.length + " selos";
  AULA_DADOS.abas.forEach((aba, idx) => {
    const badgeEl = document.getElementById("tab-done-" + idx);
    if (badgeEl) {
      badgeEl.textContent = state.completedTabs.has(idx) ? " ✓" : "";
    }
  });
}

function checkTabCompletion(abaIdx) {
  const aba = AULA_DADOS.abas[abaIdx];
  if (!aba) return;
  let allDone = true;
  for (let q = 0; q < aba.quiz.length; q++) {
    const st = state.quizAnswered[abaIdx + "-" + q];
    if (!st || !st.solved) {
      allDone = false;
      break;
    }
  }
  if (allDone && !state.completedTabs.has(abaIdx)) {
    state.completedTabs.add(abaIdx);
    updateHUD();
  }
}

/* Fisher-Yates Shuffle */
function shuffleArray(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function renderTabsAndPanels() {
  const tablist = document.getElementById("tablist");

  tablist.innerHTML = "";
  main.innerHTML = "";

  const totalTabs = AULA_DADOS.abas.length + 1;

  AULA_DADOS.abas.forEach((aba, idx) => {
    // Botão da Aba
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tab-btn";
    btn.role = "tab";
    btn.id = "tab-btn-" + idx;
    btn.setAttribute("aria-controls", "panel-" + idx);
    btn.setAttribute("aria-selected", idx === 0 ? "true" : "false");

    "🔑 Termos deste quiz: Think-Aloud = protocolo de pensar em voz alta (concorrente: durante a tarefa; retrospectivo: comentando o vídeo depois) · TCLE = Termo de Consentimento Livre e Esclarecido · LGPD = Lei Geral de Proteção de Dados · Sondagem neutra = pergunta imparcial sem dicas.",
    "🔑 Termos deste quiz: Cenário contextual = história realista sem citar nomes de botões · Nudge sem viés = pergunta neutra do moderador · Dry-run = teste piloto entre colegas antes dos usuários reais · Warm-up = quebra-gelo inicial.",
    "🔑 Termos deste quiz: Recrutamento por conveniência = chamar conhecidos fora do público real · Screener = questionário de triagem · Distratores = alternativas extras para disfarçar o critério de seleção · Buffer = margem de tempo entre sessões · No-show = falta sem aviso.",
    "🔑 Termos deste quiz: Role-Play = simulação de papéis (Moderador, Observador, Usuário) · Timestamp = marcação de minuto e segundo do vídeo · Rainbow Spreadsheet = Planilha Arco-Íris (cada participante pinta uma coluna colorida para mostrar padrões de erro).",
    "🔑 Termos deste quiz: Escala de Severidade de Nielsen = nota de 0 a 4 para gravidade do erro · Saturação de achados = repetição dos principais problemas a partir de cerca de 5 usuários por perfil · Viés de confirmação = focar apenas no que confirma nossa opinião."
  ];
  return termosPorAba[abaIdx] || "";
}

function initQuiz(aba, abaIdx) {
  const container = document.getElementById("quiz-container-" + abaIdx);
  if (!container) return;

  const termsBox = document.createElement("div");
  termsBox.className = "quiz-terms";
  termsBox.textContent = getQuizTermsForTab(abaIdx);
  container.appendChild(termsBox);

  aba.quiz.forEach((qObj, qIdx) => {
    const qKey = abaIdx + "-" + qIdx;
    state.quizAnswered[qKey] = { solved: false, wrongCount: 0 };

    const qDiv = document.createElement("div");
    qDiv.className = "quiz-q";

    const qTitle = document.createElement("p");
    qTitle.innerHTML = `<strong>Questão ${qIdx + 1}:</strong> ${qObj.pergunta}`;
    qDiv.appendChild(qTitle);

    const fbArea = document.createElement("div");
    const shuffledOpts = shuffleArray(qObj.alternativas);

    shuffledOpts.forEach((opt) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "quiz-opt";
      btn.textContent = opt.texto;
      btn.setAttribute("data-fb", opt.fb);

      btn.addEventListener("click", () => {
        const qState = state.quizAnswered[qKey];
        if (qState.solved || btn.disabled) return;

        if (opt.certa) {
          qState.solved = true;
          btn.classList.add("opt-right");
          btn.textContent = "✓ " + opt.texto;
          const allBtns = qDiv.querySelectorAll(".quiz-opt");
          allBtns.forEach(b => { b.disabled = true; });
          const pts = qState.wrongCount === 0 ? 10 : 5;
          addXP(pts);
          fbArea.innerHTML = `<div class="feedback-box fb-ok"><strong>✅ Por que esta está certa (+${pts} XP):</strong> ${opt.fb}</div>`;
          checkTabCompletion(abaIdx);
        } else {
          qState.wrongCount += 1;
          btn.disabled = true;
          btn.classList.add("opt-wrong");
          btn.textContent = "✗ " + opt.texto;

/* =========================================================
   NAVEGAÇÃO DE ABAS, HASH ROUTING E MODOS (AULA / DARK)
   ========================================================= */
function activateTab(index, updateHash) {
  const total = AULA_DADOS.abas.length + 1;
  if (index < 0 || index >= total) index = 0;
  state.activeTab = index;

  for (let i = 0; i < total; i++) {
    const btn = document.getElementById("tab-btn-" + i);
    const panel = document.getElementById("panel-" + i);
    const isSelected = i === index;
    if (btn) {
      btn.setAttribute("aria-selected", isSelected ? "true" : "false");
      btn.tabIndex = isSelected ? 0 : -1;
    }
    if (panel) {
      if (isSelected) {
        panel.classList.add("active");
      } else {
        panel.classList.remove("active");
      }
    }
  }

  if (updateHash) {
    const targetHash = index < AULA_DADOS.abas.length ? "#aba-" + (index + 1) : "#revisao";
    if (window.location.hash !== targetHash) {
      window.location.hash = targetHash;
    }
  }
}

function parseHashToTabIndex() {
  const h = window.location.hash;
  if (h === "#revisao") {
    return AULA_DADOS.abas.length;
  }
  const match = /^#aba-(\d+)$/.exec(h);
  if (match) {
    const num = parseInt(match[1], 10) - 1;
    if (num >= 0 && num < AULA_DADOS.abas.length) {
      return num;
    }
  }
  return 0;
}

window.addEventListener("hashchange", () => {
  const idx = parseHashToTabIndex();
  activateTab(idx, false);
});

  const total = AULA_DADOS.abas.length + 1;
  if (e.key === "ArrowRight") {
    e.preventDefault();
    const next = (state.activeTab + 1) % total;
    activateTab(next, true);
    document.getElementById("tab-btn-" + next).focus();
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    const prev = (state.activeTab - 1 + total) % total;
    activateTab(prev, true);
    document.getElementById("tab-btn-" + prev).focus();
  }
});

/* Botão Modo Aula (Apresentação) vs Modo Leitura */
const btnMode = document.getElementById("btn-mode");
const btnDark = document.getElementById("btn-dark");

btnMode.addEventListener("click", () => {
  const isPres = document.body.classList.toggle("presentation-mode");
  btnMode.setAttribute("aria-pressed", isPres ? "true" : "false");
  btnMode.classList.toggle("active-mode", isPres);
  btnMode.textContent = isPres ? "📖 Modo Leitura" : "🎤 Modo Aula";

  if (isPres) {
    document.body.classList.remove("dark-mode");
    btnDark.setAttribute("aria-pressed", "false");
    btnDark.classList.remove("active-mode");
    btnDark.disabled = true;
  } else {
    btnDark.disabled = false;
  }
});

/* Botão Dark Mode (disponível no Modo Leitura) */
btnDark.addEventListener("click", () => {
  if (document.body.classList.contains("presentation-mode")) return;
  const isDark = document.body.classList.toggle("dark-mode");
  btnDark.setAttribute("aria-pressed", isDark ? "true" : "false");
  btnDark.classList.toggle("active-mode", isDark);
  btnDark.textContent = isDark ? "☀️ Claro" : "🌙 Escuro";
});

/* Inicialização */
renderTabsAndPanels();
activateTab(parseHashToTabIndex(), false);
updateHUD();
</script>
